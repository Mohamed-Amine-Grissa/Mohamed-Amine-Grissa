<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="100%" role="img" aria-label="Mohamed Amine Grissa. Computer science engineering student at ISSAT Sousse. Backend systems in Java, and evaluation of language models.">
  <defs>
    <path id="o1" d="M880,165 a80,30 0 1,0 160,0 a80,30 0 1,0 -160,0"/>
    <path id="o2" d="M820,165 a140,54 0 1,0 280,0 a140,54 0 1,0 -280,0"/>
    <path id="o3" d="M760,165 a200,78 0 1,0 400,0 a200,78 0 1,0 -400,0"/>
    <style>
      :root { --ink: #1f2328; --mute: #656d76; --line: #d0d7de; --acc: #cf4a12; }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e6edf3; --mute: #8b949e; --line: #30363d; --acc: #ff6b2c; }
      }
      .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .eyebrow { fill: var(--acc); font-size: 13px; letter-spacing: 3px; }
      .name { fill: var(--ink); font-size: 60px; font-weight: 700; letter-spacing: -1.5px; }
      .lead { fill: var(--mute); font-size: 20px; }
      .note { fill: var(--mute); font-size: 12px; letter-spacing: 1px; }
      .tag { fill: var(--ink); font-size: 11px; letter-spacing: 1px; }
      .orbit { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 1300; stroke-dashoffset: 1300; animation: draw 2.4s ease-out forwards; }
      .orbit.b { animation-delay: .3s; } .orbit.c { animation-delay: .6s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .axis { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
      .core { fill: var(--acc); }
      .ring { fill: none; stroke: var(--acc); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out infinite; }
      @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(4); opacity: 0; } }
      .body { fill: var(--ink); }
      .mark { stroke: var(--mute); stroke-width: 1; fill: none; }
      .in { opacity: 0; animation: in .9s ease-out forwards; }
      .in.d1 { animation-delay: .15s; } .in.d2 { animation-delay: .35s; } .in.d3 { animation-delay: .55s; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { fill: var(--acc); animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <!-- left: identity -->
  <text class="mono eyebrow in" x="40" y="84">RATATOSKR</text>
  <text class="sans name in d1" x="37" y="158">Mohamed Amine Grissa</text>
  <text class="sans lead in d2" x="40" y="204">Computer science engineering student, ISSAT Sousse.</text>
  <text class="sans lead in d2" x="40" y="232">Backend systems in Java. Evaluation of language models.</text>
  <g class="in d3">
    <rect class="cursor" x="40" y="263" width="8" height="15"/>
    <text class="mono note" x="58" y="275">NOW: MEASURING LOCAL LLMS ON A LAPTOP CPU</text>
  </g>

  <!-- right: three orbits, one per field of work -->
  <g transform="rotate(-14 960 165)">
    <line class="axis" x1="740" y1="165" x2="1180" y2="165"/>
    <line class="axis" x1="960" y1="70" x2="960" y2="260"/>
    <use class="orbit" xlink:href="#o1"/>
    <use class="orbit b" xlink:href="#o2"/>
    <use class="orbit c" xlink:href="#o3"/>
    <circle class="ring" cx="960" cy="165" r="5"/>
    <circle class="core" cx="960" cy="165" r="5"/>

    <g>
      <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#o1"/></animateMotion>
      <circle class="body" r="4"/>
      <text class="mono tag" x="9" y="-7" transform="rotate(14)">LLM EVAL</text>
    </g>
    <g>
      <animateMotion dur="16s" begin="-5s" repeatCount="indefinite"><mpath xlink:href="#o2"/></animateMotion>
      <circle class="body" r="4"/>
      <text class="mono tag" x="9" y="-7" transform="rotate(14)">MICROSERVICES</text>
    </g>
    <g>
      <animateMotion dur="25s" begin="-17s" repeatCount="indefinite"><mpath xlink:href="#o3"/></animateMotion>
      <circle class="body" r="4"/>
      <text class="mono tag" x="9" y="-7" transform="rotate(14)">WEB / 3D</text>
    </g>
  </g>

  <!-- registration marks -->
  <path class="mark" d="M730,40 h14 M730,40 v14"/>
  <path class="mark" d="M1190,40 h-14 M1190,40 v14"/>
  <path class="mark" d="M730,290 h14 M730,290 v-14"/>
  <path class="mark" d="M1190,290 h-14 M1190,290 v-14"/>
</svg>
